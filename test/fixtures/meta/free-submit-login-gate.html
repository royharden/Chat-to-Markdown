<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Meta AI unauthenticated login gate fixture</title>
  </head>
  <body data-provider="meta" data-scenario="free-submit-login-gate">
    <nav aria-label="Sidebar">
      <button aria-label="Home"></button>
      <a href="/">New chat</a>
      <button>Create</button>
      <button>Log in</button>
      <button>Sign up</button>
    </nav>
    <main>
      <h1>Where should we start?</h1>
      <button aria-label="Add attachment"></button>
      <input placeholder="Ask Meta AI..." value="Teach me how to write a beginner Python function that converts Fahrenheit to Celsius. Include a short code block with the language label Python.">
      <button aria-label="Send"></button>
      <div role="dialog" aria-modal="true">
        <h2 class="sr-only">Log in to Meta AI</h2>
        <p>Get more from Meta AI</p>
        <p>Log in or create an account to access all of Meta AI's features and see your prompts in your history.</p>
        <button aria-label="Close"></button>
        <button>Log in</button>
      </div>
    </main>
  </body>
</html>
